<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css files/services.css">
    <title>Location Booking - The Sha Cafe</title>
</head>
<body>
    <a href="services.html" class="back-homeBtn">←</a>
    <div class="serviceform-card"> 
        <div class="serviceform-card-icon">
            <img src="images/sha-cafe-logo.png" alt="Location Booking" >
        </div>
        <h2>LOCATION BOOKING</h2>
        <p>Host your next gathering in our unique space. We offer exclusive venue hire for private events, providing the perfect atmosphere for your special occasions.</p>
        <!-- Booking Form -->
    <form class="service-form" action="thankyou.html">
        <div class="serviceform-row">
            <div class="serviceform-group">
                <label for="fullName">Full Name <span>*</span></label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="serviceform-group">
                <label for="email">Email Address <span>*</span></label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
        </div>

        <div class="serviceform-row">
            <div class="serviceform-group">
                <label for="phone">Phone Number <span>*</span></label>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>
            </div>

            <div class="serviceform-group">
                <label for="eventType">Event Type <span>*</span></label>
                <select id="eventType" required>
                    <option value="" disabled selected>Select event type</option>
                    <option value="birthday">Birthday Party</option>
                    <option value="corporate">Corporate Event</option>
                    <option value="wedding">Private Reception</option>
                    <option value="workshop">Workshop / Seminar</option>
                    <option value="other">Other Celebration</option>
                </select>
            </div>
        </div>

        <div class="serviceform-row">
            <div class="serviceform-group">
                <label for="eventDate">Event Date <span>*</span></label>
                <input type="date" id="eventDate" required>
            </div>

            <div class="serviceform-group">
                <label for="guestCount">Expected Guest Count <span>*</span></label>
                <input type="number" id="guestCount" min="1" placeholder="e.g. 50" required>
            </div>
        </div>

        <div class="serviceform-group">
            <label for="requests">Special Requests / Requirements</label>
            <textarea id="requests" rows="3" placeholder="Tell us about catering, setup, or specific requirements..."></textarea>
        </div>

        <div class="serviceform-group checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" required>
                <span>I agree to the <a href="#">terms and conditions</a> and <a href="#">privacy policy</a>.</span>
            </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="form-submitBtn">
            Request Location Booking
        </button>
    </form>
    </div>
