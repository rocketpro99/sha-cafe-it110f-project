    <div class="mapbox">

        <p>Click on any marker to explore one of our cafe locations in Singapore.</p>

                    <text class="pop-up-text Line-2">Located at Jem mall, #02-17</text>
                    <text class="pop-up-text Line-3">Contact: +65 1234 8756</text>

                </g>
            </g>
